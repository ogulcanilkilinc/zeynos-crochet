<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorilerim | Zeyno's Crochet</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
</head>
<body>

    <!-- Header Root -->
    <div id="header-root"></div>

    <section class="page-section" style="padding-top: calc(var(--header-height) + var(--spacing-xl)); padding-bottom: var(--spacing-3xl);">
        <div class="container">
            <div class="page-header" style="text-align: center; margin-bottom: var(--spacing-3xl);">
                <h1 class="page-title font-playfair" data-i18n="wishlist.title">Favori Ürünlerim</h1>
                <p class="page-subtitle" data-i18n="common.search">Beğendiğiniz el emeği örgülerin listesi</p>
            </div>

            <!-- Wishlist grid loaded dynamically -->
            <div id="wishlist-grid-root">
                <div style="text-align: center; padding: 40px; color: var(--color-text-muted);" data-i18n="common.loading">Favoriler yükleniyor...</div>
            </div>
        </div>
    </section>

    <!-- Footer Root -->
    <div id="footer-root"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
